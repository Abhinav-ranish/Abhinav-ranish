name: Metrics
on:
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          user: Abhinav-ranish
          template: classic
          filename: github-metrics.svg

          # PAT needs repo, read:user, and read:org, with access to Ada's private repos.
          # read:user is required for private contribution counts, even with repo access.
          token: ${{ secrets.METRICS_TOKEN }}

          # Include lifetime activity and organization repositories.
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories_affiliations: owner, collaborator, organization_member

          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8

          plugin_followup: yes
          plugin_followup_sections: repositories
